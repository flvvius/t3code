# Self-hosted T3 relay: Postgres, the relay, and Caddy as the HTTPS reverse proxy.
# Usage and configuration: see README.md next to this file.
name: t3-relay

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *hardened
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    # The image's own postgres user (uid 70), so the container needs no capabilities.
    user: postgres
    environment:
      # The bootstrap superuser, for initialization and administration only. The relay connects
      # as `relay`, created by initdb/10-relay-role.sh.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: relay
    secrets:
      - postgres_password
      - relay_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks:
      - database
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 30

  relay:
    <<: *hardened
    build:
      context: ../../..
      dockerfile: infra/relay/selfhost/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      RELAY_PUBLIC_ORIGIN: ${RELAY_PUBLIC_ORIGIN:?set RELAY_PUBLIC_ORIGIN in .env}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in .env}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE in .env}
      RELAY_MANUAL_ENDPOINTS: ${RELAY_MANUAL_ENDPOINTS:-off}
      RELAY_CHANNELS: ${RELAY_CHANNELS:-false}
      CLOUD_MINT_PRIVATE_KEY_FILE: /run/secrets/cloud_mint_private_key
      CLOUD_MINT_PUBLIC_KEY_FILE: /run/secrets/cloud_mint_public_key
      # Push notifications need the publisher's APNs and FCM credentials; leave them off here.
      APNS_ENABLED: "false"
    secrets:
      - database_url
      - cloud_mint_private_key
      - cloud_mint_public_key
    tmpfs:
      - /tmp
    # Postgres for state, the edge for Caddy and outbound calls to the identity provider.
    networks:
      - database
      - edge
    # Relay channels buffer carried requests of up to 64 MiB in memory.
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    <<: *hardened
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on:
      relay:
        condition: service_healthy
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks:
      - edge
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # No route out: only the relay reaches Postgres, and Postgres reaches nothing.
  database:
    internal: true
  edge: {}

secrets:
  cloud_mint_private_key:
    file: ./secrets/cloud-mint-private.pem
  cloud_mint_public_key:
    file: ./secrets/cloud-mint-public.pem
  database_url:
    file: ./secrets/database-url
  postgres_password:
    file: ./secrets/postgres-password
  relay_db_password:
    file: ./secrets/relay-db-password

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
